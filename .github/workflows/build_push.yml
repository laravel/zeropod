name: Build and Publish manager/installer

on:
  push:
    tags:
      - "*"

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: laravelphp
  INSTALLER_IMAGE_NAME: zeropod-installer
  MANAGER_IMAGE_NAME: zeropod-manager
  CRIU_IMAGE_NAME: zeropod-criu
  CRIU_VERSION: v4.2.1

jobs:
  push_to_registry:
    name: Push Docker images
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.10.0

      - name: Extract metadata for installer
        id: meta_installer
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.INSTALLER_IMAGE_NAME }}

      - name: Extract metadata for manager
        id: meta_manager
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.MANAGER_IMAGE_NAME }}

      - name: Build and push installer
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          file: ./cmd/installer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_installer.outputs.tags }}
          labels: ${{ steps.meta_installer.outputs.labels }}

      - name: Build and push manager
        uses: docker/build-push-action@v4.2.1
        with:
          context: .
          file: ./cmd/manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_manager.outputs.tags }}
          labels: ${{ steps.meta_manager.outputs.labels }}
          build-args: |
            CRIU_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.CRIU_IMAGE_NAME }}:${{ env.CRIU_VERSION }}
